name: Parin Office Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true
          pub-cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate launcher image assets
        run: python3 tool/generate_launcher_assets.py

      - name: Generate Android host
        run: flutter create --empty --platforms=android --org=com.parin.office .

      - name: Set app display name
        run: sed -i 's/android:label="parin_office"/android:label="Parin Office"/' android/app/src/main/AndroidManifest.xml

      - name: Dependencies
        run: flutter pub get

      - name: Generate Android launcher icons
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Tests
        run: flutter test

      - name: Build split APKs
        run: flutter build apk --release --split-per-abi --no-tree-shake-icons

      - name: Build universal APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: parin-office-apks
          path: |
            build/app/outputs/flutter-apk/*.apk
