name: Parin Office Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true
          pub-cache: true

      - name: Generate Android host
        run: flutter create --empty --platforms=android --org=com.parin.office .

      - name: Prepare launcher icon assets
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          rsvg-convert -w 1024 -h 1024 assets/branding/parin_icon.svg -o assets/branding/parin_icon.png
          rsvg-convert -w 1024 -h 1024 assets/branding/parin_foreground.svg -o assets/branding/parin_foreground.png

      - name: Dependencies
        run: flutter pub get

      - name: Generate Android launcher icons
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Tests
        run: flutter test

      - name: Build split APKs
        run: flutter build apk --release --split-per-abi --no-tree-shake-icons

      - name: Build universal APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Verify APK outputs
        run: |
          set -e
          test -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test -f build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          test -f build/app/outputs/flutter-apk/app-x86_64-release.apk
          test -f build/app/outputs/flutter-apk/app-release.apk
          sha256sum build/app/outputs/flutter-apk/*.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: parin-office-apks
          path: build/app/outputs/flutter-apk/*
