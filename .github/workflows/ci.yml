name: Parin Office CI
on:
  push:
    branches: [main, feature/parin-office-core]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Verify AGP 9 built-in Kotlin migration
        run: |
          if grep -R 'org.jetbrains.kotlin.android' -n --include="*.gradle.kts" .; then
            echo "org.jetbrains.kotlin.android must not be applied with AGP 9+."
            exit 1
          fi
      - run: gradle --no-daemon assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: parin-office-debug
          path: app/build/outputs/apk/**/*.apk
