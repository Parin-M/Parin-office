name: Parin Office Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true
          pub-cache: true

      - name: Generate Android host
        run: flutter create --empty --platforms=android --org=com.parin.office .

      - name: Set Android app name and package
        run: |
          sed -i 's/android:label="parin_office"/android:label="Parin Office"/' android/app/src/main/AndroidManifest.xml

      - name: Prepare launcher icon assets
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          rsvg-convert -w 1024 -h 1024 assets/branding/parin_icon.svg -o assets/branding/parin_icon.png
          rsvg-convert -w 1024 -h 1024 assets/branding/parin_foreground.svg -o assets/branding/parin_foreground.png

      - name: Dependencies
        run: flutter pub get

      - name: Generate Android launcher icons
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Tests
        run: flutter test

      - name: Build ABI APKs
        run: flutter build apk --release --split-per-abi --no-tree-shake-icons

      - name: Build universal APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Verify outputs and checksums
        run: |
          set -e
          test -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test -f build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          test -f build/app/outputs/flutter-apk/app-x86_64-release.apk
          test -f build/app/outputs/flutter-apk/app-release.apk
          sha256sum build/app/outputs/flutter-apk/*.apk | tee checksums.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/*.apk
            checksums.txt
