name: parin_office
description: Professional adaptive all-in-one office suite for Android phones and tablets.
publish_to: "none"
version: 0.9.0+90
environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: "3.47.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_picker: ^13.1.0
  shared_preferences: ^2.5.6
  intl: ^0.20.3
  dart_pdf_editor: ^7.0.0
  flutter_quill: ^11.6.0
  excel_plus: ^2.27.1
  archive: ^4.2.0
  pdf: ^3.13.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/templates/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/parin_icon.png
  adaptive_icon_background: "#101426"
  adaptive_icon_foreground: assets/branding/parin_icon_foreground.png
  adaptive_icon_monochrome: assets/branding/parin_icon_monochrome.png
  min_sdk_android: 24
